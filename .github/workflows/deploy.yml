# Builds the website and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repo (Settings):
#   - Pages -> Build and deployment -> Source: "GitHub Actions"; Custom domain: roadtrip.thejumpvault.com
#   - Secrets and variables -> Actions -> Variables:
#       SUPABASE_URL              e.g. https://supabase.example.com
#       SUPABASE_PUBLISHABLE_KEY  the publishable/anon key (never the service_role key)
# Without the variables the site still deploys, in demo mode.

name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, lint and test
        run: |
          # Normally generated by `expo start`; needed for the CSS import types.
          printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
          npx tsc --noEmit
          npx expo lint
          npm test

      - name: Build
        run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SITE_URL: https://roadtrip.thejumpvault.com

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
